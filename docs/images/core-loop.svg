<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b5566"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#0b2233">Core gameplay loop</text>

  <!-- loop nodes (clockwise) -->
  <g font-size="16" text-anchor="middle">
    <rect x="345" y="70" width="210" height="70" rx="14" fill="#e6f1f7" stroke="#2a7aa6" stroke-width="2"/>
    <text x="450" y="100" font-weight="700" fill="#0b2233">1. Sail &amp; explore</text>
    <text x="450" y="122" fill="#3b5566">W/S move, A/D steer</text>

    <rect x="640" y="170" width="220" height="70" rx="14" fill="#e6f1f7" stroke="#2a7aa6" stroke-width="2"/>
    <text x="750" y="200" font-weight="700" fill="#0b2233">2. Spot a barrel</text>
    <text x="750" y="222" fill="#3b5566">small +10 near / big +50 far</text>

    <rect x="640" y="330" width="220" height="80" rx="14" fill="#fff4d6" stroke="#d9a21b" stroke-width="2"/>
    <text x="750" y="360" font-weight="700" fill="#0b2233">3. Decide the route</text>
    <text x="750" y="382" fill="#3b5566">safe and small, or risky</text>
    <text x="750" y="400" fill="#3b5566">and big (pirate waters)?</text>

    <rect x="345" y="440" width="210" height="80" rx="14" fill="#fde5e3" stroke="#c9372c" stroke-width="2"/>
    <text x="450" y="470" font-weight="700" fill="#0b2233">4. Overcome the threat</text>
    <text x="450" y="492" fill="#3b5566">avoid / outrun the pirates,</text>
    <text x="450" y="510" fill="#3b5566">flee to the safe zone</text>

    <rect x="40" y="330" width="220" height="80" rx="14" fill="#e3f5e6" stroke="#2f8f46" stroke-width="2"/>
    <text x="150" y="360" font-weight="700" fill="#0b2233">5. Collect &amp; get feedback</text>
    <text x="150" y="382" fill="#3b5566">"+10" popup, money counts</text>
    <text x="150" y="400" fill="#3b5566">up, barrel counter</text>

    <rect x="40" y="170" width="220" height="70" rx="14" fill="#e3f5e6" stroke="#2f8f46" stroke-width="2"/>
    <text x="150" y="200" font-weight="700" fill="#0b2233">6. Reward / progress</text>
    <text x="150" y="222" fill="#3b5566">more money, fewer barrels left</text>
  </g>

  <!-- arrows -->
  <g fill="none" stroke="#3b5566" stroke-width="2.5" marker-end="url(#a)">
    <path d="M555,105 C610,110 660,130 700,168"/>
    <path d="M750,242 L750,326"/>
    <path d="M700,412 C660,450 610,475 558,478"/>
    <path d="M342,478 C290,475 240,450 200,413"/>
    <path d="M150,328 L150,244"/>
    <path d="M200,168 C240,130 290,110 342,105"/>
  </g>

  <!-- center -->
  <circle cx="450" cy="290" r="95" fill="#0b2233"/>
  <text x="450" y="275" text-anchor="middle" font-size="18" font-weight="700" fill="#ffc94a">Repeat until</text>
  <text x="450" y="300" text-anchor="middle" font-size="15" fill="#ffffff">all 28 barrels = WIN</text>
  <text x="450" y="322" text-anchor="middle" font-size="15" fill="#ff8a80">caught = LOSE</text>
</svg>
